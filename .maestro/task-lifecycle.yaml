# The one end-to-end flow. Declared a bonus in SPEC-001 §18.1, so it covers the golden path
# rather than trying to be a suite: sign in if the session is not already restored, reject a
# duplicate title, accept a good one, and delete the task again so the flow leaves the shared
# API exactly as it found it.
#
# Run with the simulator booted and Metro running, passing a phone number registered under
# Firebase Console -> Authentication -> Sign-in method -> Phone -> Test phone numbers, and the
# code registered with it:
#   maestro test -e TEST_PHONE=+972500000000 -e TEST_CODE=000000 .maestro/task-lifecycle.yaml
#
# The credentials are parameters rather than literals because they belong to whoever is running
# this, not to the repository. A real number committed here would be one more place to scrub the
# day the project changes hands.
#
# It deliberately does not cover the offline cycle. Maestro can drive the taps but cannot
# assert what reached the server, and that assertion is the whole point of the offline claim —
# see FW-06 in docs/future-work.md for the harness that would be needed.

appId: org.reactjs.native.example.CaliAlfa
name: Task lifecycle — sign in, reject a duplicate title, create, delete
env:
  TEST_PHONE: ''
  TEST_CODE: ''
---
- launchApp

# Sign-in runs only on a cold install. A restored session skips straight to the list, which is
# FR-2, so the flow must not assume either state.
- runFlow:
    when:
      visible:
        id: 'welcome.next'
    commands:
      - tapOn:
          id: 'welcome.next'
      - tapOn:
          id: 'phoneNumber.field'
      - inputText: '${TEST_PHONE}'
      - tapOn:
          id: 'phoneNumber.next'
      - assertVisible:
          id: 'otp.field'
      - tapOn:
          id: 'otp.field'
      - inputText: '${TEST_CODE}'
      - tapOn:
          id: 'otp.next'

- assertVisible:
    id: 'taskList.list'

# FR-14: a duplicate title is rejected inline and the submit stays disabled.
- tapOn:
    id: 'taskList.newTask'
- assertVisible:
    id: 'taskForm.title'
- tapOn:
    id: 'taskForm.title'
- inputText: 'Renew passport'
- assertVisible: '.*already exists.*'

# A unique title clears it, and the task lands in the list.
- eraseText: 14
- inputText: 'Post the Maestro flow'
- tapOn:
    id: 'taskForm.submit'
- assertVisible:
    id: 'taskList.list'
- assertVisible: 'Post the Maestro flow'

# FR-9, FR-10: the row menu, the confirmation sheet, and the row gone afterwards.
- tapOn:
    id: "taskList\\.row\\..*\\.actions"
    index: 0
- tapOn: 'Delete'
# The sheet's container carries `taskList.deleteDialog`, but the sheet presents through a React
# Native `Modal`, which lives in its own UIWindow, and only accessible elements cross into the
# XCUITest hierarchy — the container is a plain view, so Maestro cannot see it. Its buttons are
# pressables and do come through, so the confirm button is what the flow asserts on.
- assertVisible:
    id: 'taskList.deleteDialog.confirm'
- tapOn:
    id: 'taskList.deleteDialog.confirm'
- assertNotVisible: 'Post the Maestro flow'
